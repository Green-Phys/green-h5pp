name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    strategy:
      fail-fast: false

    runs-on: [ self-hosted, ift-vm ]
    steps:
    - uses: actions/checkout@v7

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y openmpi-bin libopenmpi-dev libhdf5-dev libeigen3-dev libopenblas-dev lcov

    - name: Build h5pp
      run: |
        mkdir build && cd build && cmake  -DCMAKE_CXX_FLAGS=" --coverage -fno-inline -fno-inline-small-functions -fno-default-inline -fprofile-arcs -ftest-coverage " ..;
        make -j2 || make -j1 VERBOSE=1

    - name: Test h5pp
      env:
        HDF5_USE_FILE_LOCKING: 'FALSE'
      run: |
        cd build;
        ctest -j4 --output-on-failure

    - name: Run coverage
      run: |
        cd build;
        lcov --ignore-errors source,source --capture --directory . --output-file coverage.info;
        lcov --ignore-errors unused --remove coverage.info '/usr/*' --output-file coverage.info
        lcov --ignore-errors unused --remove coverage.info '/opt/ohpc/pub/compiler/*' --output-file coverage.info
        lcov --ignore-errors unused --remove coverage.info '*catch*' --output-file coverage.info
        lcov --list coverage.info

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v7
      env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

